<title>ИИ-курсы на русском</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: одна страница — главная библиотека с треками курсов; курс открывается на месте: оглавление слева, урок справа, сертификат как бланк */
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#18202B; --muted:#5B6676; --line:#D6DCE4;
  --accent:#2747C9; --accent-soft:#E3E8FB; --seal:#C48A1C; --ok:#1E7A4C; --ok-soft:#DFF2E7; --bad:#B4362E; --bad-soft:#F8E1DF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141B; --paper:#171D27; --ink:#E6EAF0; --muted:#97A2B3; --line:#2A3342;
  --accent:#8EA4FF; --accent-soft:#1E2846; --seal:#E2B04F; --ok:#5CC892; --ok-soft:#163327; --bad:#F08A80; --bad-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --paper:#171D27; --ink:#E6EAF0; --muted:#97A2B3; --line:#2A3342;
  --accent:#8EA4FF; --accent-soft:#1E2846; --seal:#E2B04F; --ok:#5CC892; --ok-soft:#163327; --bad:#F08A80; --bad-soft:#3A1E1C; color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,42px);line-height:1.1;margin:6px 0 8px;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{max-width:66ch;margin:0;color:var(--muted)}
a{color:var(--accent)}

/* home */
.home{display:flex;flex-direction:column;gap:40px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{color:var(--accent);font-weight:500}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.how div{border-top:2px solid var(--accent);padding-top:10px;font-size:14px;color:var(--muted);min-width:0}
.how b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
section.track h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 4px}
section.track .sub{margin:0 0 16px;color:var(--muted);font-size:14px;max-width:66ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.c{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);min-width:0;color:var(--ink)}
.c:hover{border-color:var(--accent)}
.c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c.ext{text-decoration:none}
.c .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.prov{border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.ru{background:var(--accent-soft);color:var(--accent)}
.c .len{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.c h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.c p{margin:0;font-size:14px;color:var(--muted)}
.c .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:auto}
.c .bar i{display:block;height:100%;background:var(--accent)}
.c .go{font-weight:500;color:var(--accent);font-size:14px;margin-top:auto}
.foot{font-size:13px;color:var(--muted);max-width:72ch;border-top:1px solid var(--line);padding-top:16px}

/* course */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.back{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-bottom:8px}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.orig{font-family:var(--f-mono);font-size:12px;text-decoration:none}
a.orig:hover{text-decoration:underline}
.progress{min-width:220px;flex:0 1 320px}
.progress .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.progress .lbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:18px}
.mod-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:6px;font-size:14px;line-height:1.35;color:var(--ink)}
.toc button:hover{background:var(--accent-soft)}
.toc button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toc button[aria-current="true"]{background:var(--accent);color:var(--paper)}
.toc button .n{font-family:var(--f-mono);font-size:12px;opacity:.7;min-width:28px;font-variant-numeric:tabular-nums}
.toc button .st{margin-left:auto;font-size:12px}
.toc button.locked{opacity:.5}
main.pane{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,4vw,44px);min-width:0}
.lesson-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
main h2{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0 0 20px;text-wrap:balance}
main h3{font-size:18px;margin:28px 0 8px;font-weight:600}
main p,main li{max-width:68ch}
main ul,main ol.body{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 6px 6px 0;margin:18px 0;max-width:68ch}
.note b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;color:var(--accent)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.cmp div{border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.cmp .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.cmp .bad .tag{color:var(--bad)} .cmp .good .tag{color:var(--ok)}
.cmp pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;line-height:1.5;margin:0}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
.tbl{overflow-x:auto}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
.task{border:1px dashed var(--accent);border-radius:8px;padding:14px 16px;margin:20px 0;max-width:68ch}
.task b{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
pre.code{font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:14px 0;max-width:100%;white-space:pre}
main code{font-family:var(--f-mono);font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre.code code{background:none;border:0;padding:0}
.quiz{display:flex;flex-direction:column;gap:22px;margin-top:8px}
.q{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0}
.q .qt{font-weight:600;margin-bottom:10px;padding:0}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;cursor:pointer}
.q label:hover{background:var(--accent-soft)}
.q input{margin-top:5px;accent-color:var(--accent)}
.q.right{border-color:var(--ok);background:var(--ok-soft)}
.q.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .ex{margin-top:8px;font-size:14px;color:var(--muted)}
.result{font-family:var(--f-mono);font-size:14px;padding:12px 16px;border-radius:8px}
.result.pass{background:var(--ok-soft);color:var(--ok)} .result.fail{background:var(--bad-soft);color:var(--bad)}
.nav-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;padding:10px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cert-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 24px}
.cert-form input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);flex:1 1 240px;min-width:0}
.cert{position:relative;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:10px;max-width:820px}
.cert-in{border:1px solid var(--ink);padding:clamp(22px,5vw,52px);display:flex;flex-direction:column;gap:14px;background:repeating-linear-gradient(135deg,transparent 0 14px,var(--accent-soft) 14px 15px)}
.cert-in>*{position:relative}
.cert .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cert .ttl{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.2vw,40px);line-height:1.08;padding-right:clamp(70px,14vw,120px)}
.cert .who{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,3.6vw,32px);color:var(--accent);border-bottom:1px solid var(--ink);padding-bottom:6px;overflow-wrap:anywhere}
.cert .row{display:flex;flex-wrap:wrap;gap:24px 40px;margin-top:10px;font-variant-numeric:tabular-nums}
.cert .row div{display:flex;flex-direction:column;gap:2px}
.cert .row span:last-child{font-family:var(--f-mono);font-size:15px}
.seal{position:absolute;right:clamp(16px,4vw,40px);top:clamp(16px,4vw,40px);width:clamp(70px,13vw,112px);height:auto}
.disc{font-size:12px;color:var(--muted);margin-top:8px;max-width:72ch}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:static;flex-direction:row;overflow-x:auto;gap:12px;padding-bottom:6px}
  nav.toc section{flex:0 0 250px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const TRACKS=[{"id": "start", "t": "Старт: ИИ в работе с Claude", "s": "Курсы Anthropic для всех, без технических знаний. Подходят как подготовка к Claude Academy."}, {"id": "basics", "t": "Основы ИИ", "s": "Самые известные бесплатные вводные курсы других организаций. Русской версии у оригиналов нет, поэтому уроки сделаны здесь."}, {"id": "build", "t": "Создатели", "s": "Для тех, кто делает свои приложения и автоматизации, в том числе вайб-кодингом."}, {"id": "dev", "t": "Разработчики", "s": "API и платформа для встраивания Claude в свои системы."}];
const LINKS=[{"name": "AI for Beginners", "prov": "Microsoft", "ru": "Русский", "len": "12 недель · 24 урока", "desc": "Основы ИИ: символьный ИИ, нейросети, компьютерное зрение, обработка текста, этика.", "url": "https://github.com/microsoft/AI-For-Beginners/blob/main/translations/ru/README.md"}, {"name": "Generative AI for Beginners", "prov": "Microsoft", "ru": "Русский", "len": "21 урок", "desc": "Создание приложений на генеративном ИИ: промпты, RAG, агенты, безопасность.", "url": "https://github.com/microsoft/generative-ai-for-beginners/blob/main/translations/ru/README.md"}, {"name": "AI Agents for Beginners", "prov": "Microsoft", "ru": "Русский", "len": "Серия уроков", "desc": "Как устроены ИИ-агенты и как их строить: инструменты, планирование, мультиагентные системы.", "url": "https://microsoft.github.io/ai-agents-for-beginners/translations/ru/"}, {"name": "ML for Beginners", "prov": "Microsoft", "ru": "Русский", "len": "12 недель · 26 уроков", "desc": "Классическое машинное обучение на Python и scikit-learn с практическими проектами.", "url": "https://github.com/microsoft/ML-For-Beginners/blob/main/translations/ru/README.md"}, {"name": "LLM Course", "prov": "Hugging Face", "ru": "Частично на русском", "len": "Технический", "desc": "Трансформеры и большие языковые модели. На русский переведена часть глав, остальное на английском.", "url": "https://huggingface.co/learn/llm-course/ru/chapter1/1"}];

Object.assign((function(){
const COURSE = [
 {id:"m1", title:"Знакомство с Claude", lessons:[
  {id:"1.1", title:"Что такое Claude", html:`
<p>Claude — это ИИ-ассистент от компании Anthropic. Под капотом у него большая языковая модель: она обучена на огромном объёме текстов и умеет читать, писать, рассуждать, анализировать документы и таблицы, писать код и выполнять многошаговые задачи с помощью инструментов.</p>
<h3>В чём Claude силён</h3>
<ul>
<li><b>Работа с текстом:</b> письма, отчёты, регламенты, перевод, сокращение длинных документов.</li>
<li><b>Анализ:</b> разбор таблиц, поиск закономерностей, сравнение вариантов, расчёты через код.</li>
<li><b>Мышление вслух:</b> разложить проблему на части, найти слабые места в плане, подготовиться к переговорам.</li>
<li><b>Создание готовых вещей:</b> документы, таблицы, презентации, небольшие веб-приложения.</li>
</ul>
<h3>Ограничения, о которых надо помнить</h3>
<ul>
<li><b>Может ошибаться.</b> Цифры, факты, ссылки на законы проверяйте, особенно если на них будут опираться решения.</li>
<li><b>Знания имеют дату отсечки.</b> О свежих событиях Claude узнаёт только через веб-поиск или ваши файлы.</li>
<li><b>Не знает ваш контекст</b>, пока вы его не дали: свою компанию, склады, клиентов, внутренние правила.</li>
</ul>
<div class="note"><b>Главная мысль урока</b>Относитесь к Claude как к очень способному новому сотруднику: он быстро учится и много умеет, но ему нужен понятный бриф, и его работу стоит проверять.</div>`},
  {id:"1.2", title:"Первый разговор", html:`
<p>Начать просто: откройте claude.ai или приложение и напишите задачу обычным языком, на русском. Специальный синтаксис не нужен.</p>
<h3>Разговор — это итерации</h3>
<p>Первый ответ редко бывает финальным. Сильные пользователи не переписывают запрос с нуля, а продолжают диалог:</p>
<ul>
<li>«Сделай короче, на полстраницы».</li>
<li>«Тон более официальный, это письмо директору».</li>
<li>«Пункт 3 неверный: у нас отгрузка не по пятницам, а по средам. Перепиши с учётом этого».</li>
<li>«Какие вопросы ты бы задал мне, чтобы сделать это лучше?»</li>
</ul>
<h3>Что можно прикладывать</h3>
<p>Файлы PDF, Word, Excel, CSV, изображения и скриншоты. Claude прочитает их и будет отвечать с опорой на их содержимое. Например, можно приложить выгрузку остатков и попросить найти позиции с запасом меньше недели.</p>
<div class="task"><b>Практика · 5 минут</b><br>Откройте новый чат и попросите Claude объяснить разницу между FIFO и FEFO на примере алкогольного склада. Затем попросите переделать объяснение для нового кладовщика без опыта. Сравните два ответа.</div>`},
  {id:"1.3", title:"Как получать лучшие результаты", html:`
<p>Качество ответа почти всегда упирается в качество брифа. Пять приёмов дают основную часть эффекта.</p>
<ol class="body">
<li><b>Контекст.</b> Кто вы, для кого результат, зачем он нужен.</li>
<li><b>Конкретная задача.</b> Что именно на выходе: письмо, таблица, план из 5 шагов.</li>
<li><b>Ограничения.</b> Объём, тон, что точно нельзя, какие данные считать верными.</li>
<li><b>Примеры.</b> Покажите образец хорошего результата, если он есть.</li>
<li><b>Разрешение уточнять.</b> «Если чего-то не хватает, сначала спроси».</li>
</ol>
<div class="cmp">
<div class="bad"><div class="tag">Слабо</div><pre>Напиши письмо перевозчику про опоздания.</pre></div>
<div class="good"><div class="tag">Сильно</div><pre>Я руководитель логистики дистрибьютора алкоголя в Ташкенте. Перевозчик за сентябрь сорвал 7 из 40 рейсов (опоздание больше 4 часов). Напиши письмо директору перевозчика: вежливо, но твёрдо, с фактами, требованием плана исправления до 25-го и упоминанием штрафа по п. 6.2 договора. Не больше 200 слов.</pre></div>
</div>
<h3>Сложную задачу — по шагам</h3>
<p>Вместо «сделай мне анализ поставщиков» лучше: сначала «предложи критерии оценки», потом «оцени по ним трёх поставщиков из таблицы», потом «сформулируй вывод для руководства». Так проще проверять промежуточный результат.</p>
<div class="note"><b>Совет</b>Попросите Claude сначала показать план или задать вопросы, а потом выполнять. На больших задачах это экономит больше всего времени.</div>`},

 {id:"m2", title:"Рабочее пространство", lessons:[
  {id:"2.1", title:"Claude на компьютере: чат, задачи, код", html:`
<p>Claude доступен в браузере, в мобильном приложении и в десктоп-приложении для Windows и macOS. В десктопе у Claude больше возможностей для серьёзной работы.</p>
<div class="tbl"><table class="t">
<tr><th>Режим</th><th>Когда использовать</th><th>Пример</th></tr>
<tr><td>Чат</td><td>Вопрос, черновик, обсуждение идеи</td><td>«Как сократить простой машин под погрузкой?»</td></tr>
<tr><td>Долгие задачи</td><td>Многошаговая работа, на выходе готовый файл или отчёт. Можно уйти и вернуться</td><td>«Собери из этих 12 накладных сводную таблицу расхождений и короткий отчёт»</td></tr>
<tr><td>Claude Code</td><td>Программирование, работа с проектом из кода</td><td>Ваше приложение для склада</td></tr>
</table></div>
<p>Если подключить к чату папку с компьютера, Claude сможет читать файлы оттуда и сохранять туда результат. Перед удалением файлов он спросит разрешение.</p>
<div class="note"><b>Правило выбора</b>Нужен ответ, чтобы прочитать и двигаться дальше, — это чат. Нужен готовый результат, который вы сохраните или отправите, — это задача.</div>`},
  {id:"2.2", title:"Проекты", html:`
<p>Проект — это папка для связанной работы. В нём три вещи:</p>
<ul>
<li><b>Инструкции проекта.</b> Постоянный бриф, который Claude учитывает в каждом чате проекта: кто вы, правила, тон, формат.</li>
<li><b>Знания.</b> Файлы, которые всегда под рукой: регламенты, договоры, прайсы, справочник SKU.</li>
<li><b>Чаты.</b> Все разговоры по теме собраны в одном месте.</li>
</ul>
<h3>Пример: проект «Склад и перевозчики»</h3>
<div class="cmp"><div><div class="tag">Инструкции</div><pre>Я руковожу логистикой дистрибьютора алкоголя: 5 складов по Узбекистану. Отвечай по-русски, кратко, цифры — в таблицах. Даты в формате ДД.ММ.ГГГГ. Если не уверен в данных, так и скажи.</pre></div>
<div><div class="tag">Знания</div><pre>• Договор с перевозчиком.pdf
• Регламент приёмки.docx
• Справочник SKU.xlsx
• Схема складов.pdf</pre></div></div>
<p>Теперь в любом чате проекта можно спросить «какой штраф за опоздание по договору?», и Claude ответит по вашему документу.</p>
<div class="task"><b>Практика</b><br>Создайте проект под одну рабочую тему, напишите инструкции на 3–5 строк и загрузите 2–3 документа. Задайте вопрос, ответ на который есть только в этих документах.</div>`},
  {id:"2.3", title:"Артефакты", html:`
<p>Артефакт — это готовая вещь, которую Claude делает отдельно от переписки: документ, таблица, презентация, дашборд, небольшое веб-приложение или схема. Его можно открыть рядом с чатом, доработать, скачать или поделиться ссылкой.</p>
<h3>Что можно сделать артефактом</h3>
<ul>
<li>Регламент или инструкцию для кладовщиков (документ).</li>
<li>Трекер рейсов с фильтрами (таблица или мини-приложение).</li>
<li>Дашборд KPI склада: OTIF, оборачиваемость, точность сборки.</li>
<li>Презентацию для руководства о результатах квартала.</li>
<li>Калькулятор загрузки машины по паллетам.</li>
</ul>
<p>Этот курс, кстати, тоже артефакт.</p>
<div class="note"><b>Как просить</b>Опишите, кто будет пользоваться и что должно быть на экране: «Сделай калькулятор: ввожу количество коробок по SKU, он считает паллеты и подсказывает, влезет ли в 20-тонник».</div>`},
  {id:"2.4", title:"Скиллы", html:`
<p>Скилл (навык) — это папка с инструкциями и при необходимости скриптами, которая учит Claude делать определённую работу хорошо и одинаково каждый раз. Claude сам подгружает подходящий навык, когда видит, что задача ему соответствует.</p>
<h3>Встроенные и свои</h3>
<ul>
<li><b>Встроенные:</b> например, создание файлов Excel, Word, PowerPoint, PDF.</li>
<li><b>Свои:</b> вы описываете повторяющийся процесс один раз, и Claude выполняет его по вашим правилам. Например: «Еженедельный отчёт по складам: формат, разделы, какие метрики, как подсвечивать отклонения».</li>
</ul>
<div class="cmp">
<div><div class="tag">Проект</div><pre>Контекст и знания по одной теме. Живёт внутри проекта.</pre></div>
<div><div class="tag">Скилл</div><pre>Способ выполнять конкретный тип задачи. Работает в любом чате, где задача подходит.</pre></div>
</div>
<div class="note"><b>Признак, что нужен скилл</b>Вы третий раз объясняете Claude одно и то же про формат отчёта. Попросите: «Сделай из этого процесса скилл».</div>`},

  {q:"Где хранить постоянные правила и документы по одной рабочей теме?", a:["В проекте: инструкции и знания","В каждом новом сообщении заново","В настройках браузера"], c:0, ex:"Проект хранит инструкции и файлы, которые Claude учитывает во всех чатах проекта."},
  {q:"Что такое артефакт?", a:["Ошибка в ответе Claude","Готовая вещь отдельно от переписки: документ, таблица, приложение","Архив старых чатов"], c:1, ex:"Артефакт можно открыть, доработать, скачать и поделиться ссылкой."},
  {q:"Когда стоит сделать скилл?", a:["Для разового вопроса","Когда одна и та же процедура повторяется и должна выполняться одинаково","Только для программистов"], c:1, ex:"Скилл закрепляет повторяющийся способ работы."},
 ]},
 {id:"m3", title:"Расширяем возможности", lessons:[
  {id:"3.1", title:"Коннекторы к вашим инструментам", html:`
<p>Коннекторы подключают Claude к сервисам, где живут ваши данные: Google Drive, Gmail, Google Calendar, Slack, Notion, Asana, Jira, Canva и многим другим. Технически многие из них работают через открытый стандарт MCP (Model Context Protocol).</p>
<h3>Что это даёт</h3>
<ul>
<li>«Найди в почте все письма от перевозчика за октябрь и составь список претензий».</li>
<li>«Посмотри мой календарь на завтра и подготовь короткую справку к каждой встрече».</li>
<li>«Возьми таблицу остатков из Google Drive и найди позиции ниже страхового запаса».</li>
</ul>
<h3>Безопасность</h3>
<ul>
<li>Claude видит только то, к чему вы дали доступ.</li>
<li>Действия, которые что-то отправляют или меняют (письмо, сообщение, событие), Claude подтверждает у вас.</li>
<li>Подключайте только те сервисы, которые нужны для работы.</li>
</ul>`},
  {id:"3.2", title:"Корпоративный поиск", html:`
<p>В организационных тарифах Claude может искать сразу по нескольким подключённым источникам компании: документам, переписке, базе знаний. Вместо того чтобы помнить, где лежит регламент, вы спрашиваете: «Какой у нас порядок списания боя при приёмке?»</p>
<p>Claude находит релевантные куски в разных системах, собирает ответ и указывает, откуда взял информацию. Это главное: по ссылкам вы проверяете ответ в первоисточнике.</p>
<div class="note"><b>Где пригодится</b>Онбординг новых логистов, поиск условий в договорах, ответы на вопросы проверяющих, сбор истории по спорной поставке.</div>
<p>Доступность этой функции зависит от тарифа и настроек вашей организации.</p>`},
  {id:"3.3", title:"Исследование и память", html:`
<h3>Режим исследования</h3>
<p>Для вопросов, где нужно пройти по многим источникам, Claude делает десятки поисков, читает страницы и собирает структурированный отчёт со ссылками. Это занимает от нескольких минут.</p>
<ul>
<li>«Сравни требования к маркировке алкоголя в Узбекистане и Казахстане на сегодня».</li>
<li>«Какие WMS-системы используют дистрибьюторы среднего размера в СНГ и сколько стоит внедрение».</li>
</ul>
<p>Обычный веб-поиск подходит для быстрых фактов. Исследование — когда нужна полная картина.</p>
<h3>Память</h3>
<p>Claude может помнить важное о вас между разговорами: роль, проекты, предпочтения по формату. Вы можете попросить что-то запомнить или забыть, а саму память отключить в настройках.</p>
<div class="note"><b>Привычка</b>Проверяйте ссылки в отчёте исследования на ключевых выводах, особенно если речь о законах и цифрах.</div>`},

  {q:"Когда лучше выбрать режим исследования, а не быстрый поиск?", a:["Узнать курс доллара","Нужен обзор по многим источникам с выводами","Посчитать 15% от суммы"], c:1, ex:"Исследование нужно для сложных вопросов с многими источниками."},

 {id:"m4", title:"Всё вместе", lessons:[
  {id:"4.1", title:"Claude в работе: сценарии по ролям", html:`
<div class="tbl"><table class="t">
<tr><th>Роль</th><th>Типичные задачи</th></tr>
<tr><td>Логистика и склад</td><td>Анализ выгрузок остатков, ABC/XYZ, расчёт страхового запаса, письма перевозчикам, регламенты, разбор расхождений по накладным, KPI-дашборды</td></tr>
<tr><td>Закупки</td><td>Сравнение коммерческих предложений, подготовка к переговорам, проверка договоров на риски</td></tr>
<tr><td>Продажи</td><td>Подготовка к встрече с клиентом, анализ продаж по каналам, тексты предложений</td></tr>
<tr><td>Финансы</td><td>Сверки, пояснения к отклонениям бюджета, модели в Excel</td></tr>
<tr><td>Руководитель</td><td>Отчёты для собственника, планы проектов, обратная связь сотрудникам, разбор сложных решений</td></tr>
</table></div>
<h3>Сквозной пример</h3>
<p>Задача: подготовить квартальный отчёт по логистике для собственника.</p>
<ol class="body">
<li>В проекте «Логистика» лежат регламенты и прошлые отчёты.</li>
<li>Коннектор к Google Drive даёт доступ к выгрузкам рейсов и остатков.</li>
<li>Скилл «квартальный отчёт» задаёт формат и метрики.</li>
<li>Claude считает показатели кодом, делает дашборд и документ-артефакт.</li>
<li>Вы проверяете ключевые цифры и правите выводы в диалоге.</li>
</ol>`},
  {id:"4.2", title:"Другие способы работать с Claude", html:`
<ul>
<li><b>Мобильное приложение:</b> голосом в дороге, фото накладной или паллета с вопросом.</li>
<li><b>Claude в браузере Chrome:</b> Claude работает с сайтами: читает страницы, заполняет формы по вашей просьбе.</li>
<li><b>Claude for M365:</b> внутри Excel, Word, PowerPoint и Outlook.</li>
<li><b>Claude в Slack:</b> агент для командной работы прямо в рабочих каналах.</li>
<li><b>Claude Code:</b> программирование с агентом в терминале, вебе и десктопе.</li>
<li><b>API:</b> разработчики встраивают Claude в свои системы, например в ERP или WMS.</li>
</ul>
<div class="note"><b>Что выбрать</b>Начните с приложения на компьютере и телефоне. Остальное подключайте, когда появится конкретная задача.</div>`},
  {id:"4.3", title:"Что дальше", html:`
<p>Вы прошли основу. Дальше на Claude Academy (academy.claude.com) есть курсы, которые логично взять следующими:</p>
<ul>
<li><b>AI Fluency</b> — как грамотно делегировать ИИ, описывать задачу и проверять результат.</li>
<li><b>AI Capabilities and Limitations</b> — откуда берутся ошибки модели и как их избегать.</li>
<li><b>Claude Code 101</b> — если вы делаете свои приложения.</li>
</ul>
<h3>План на неделю</h3>
<ol class="body">
<li>Создайте один проект под главную рабочую тему.</li>
<li>Подключите один коннектор, которым пользуетесь каждый день.</li>
<li>Сделайте один артефакт, который реально будете использовать.</li>
<li>Найдите повторяющуюся задачу и превратите её в скилл.</li>
</ol>
<p>После этого откройте итоговый экзамен: 10 вопросов, проходной балл 80%.</p>`},

 {id:"m1", title:"Что такое ИИ-грамотность", lessons:[
  {id:"1.1", title:"Зачем учиться работать с ИИ", html:`
<p>ИИ-грамотность (AI Fluency) — это умение работать с ИИ эффективно, результативно, этично и безопасно. Речь не о знании кнопок конкретной программы. Это навыки, которые остаются полезными, когда меняются модели и интерфейсы.</p>
<h3>Три способа работать с ИИ</h3>
<div class="tbl"><table class="t">
<tr><th>Режим</th><th>Суть</th><th>Пример из логистики</th></tr>
<tr><td>Автоматизация</td><td>ИИ выполняет конкретную задачу по вашей инструкции</td><td>«Переведи это письмо поставщику на английский»</td></tr>

<tr><td>Агентность</td><td>Вы настраиваете ИИ, чтобы он сам выполнял работу или взаимодействовал с другими</td><td>Агент каждое утро собирает отчёт по рейсам и рассылает начальникам складов</td></tr>
</table></div>
<p>Один и тот же человек за день переключается между всеми тремя режимами. Грамотность в том, чтобы понимать, какой режим сейчас нужен.</p>
<div class="note"><b>Главная мысль</b>ИИ-грамотность — это не про технологию, а про качество совместной работы человека и ИИ.</div>`},
  {id:"1.2", title:"Модель 4D", html:`
<p>Курс построен на модели из четырёх навыков. В английском оригинале все четыре начинаются на D, отсюда название.</p>
<div class="tbl"><table class="t">
<tr><th>Навык</th><th>Вопрос, на который он отвечает</th></tr>
<tr><td><b>Делегирование</b> (Delegation)</td><td>Что делать мне, что поручить ИИ, а что делать вместе?</td></tr>
<tr><td><b>Описание</b> (Description)</td><td>Как понятно объяснить ИИ, что мне нужно?</td></tr>
<tr><td><b>Различение</b> (Discernment)</td><td>Хорош ли результат? Можно ли ему доверять?</td></tr>
<tr><td><b>Добросовестность</b> (Diligence)</td><td>Отвечаю ли я за то, как использую ИИ и что выпускаю в мир?</td></tr>
</table></div>
<p>Навыки связаны в цикл: вы решаете, что поручить, описываете задачу, оцениваете результат, уточняете описание и снова оцениваете. Добросовестность действует на всех этапах.</p>
<div class="note"><b>Совет</b>Если результат плохой, сначала спросите себя: проблема в делегировании (не та задача для ИИ), в описании (плохой бриф) или в различении (я не понял, что не так)?</div>`},
  {id:"1.3", title:"Как устроены языковые модели", html:`
<p>Чтобы работать с ИИ грамотно, достаточно базового понимания механики.</p>
<ul>
<li><b>Модель предсказывает текст.</b> Она обучена на огромном количестве текстов и генерирует ответ слово за словом, опираясь на выученные закономерности.</li>
<li><b>Знания имеют дату отсечки.</b> О событиях после обучения модель знает только из поиска или ваших материалов.</li>
<li><b>Контекст ограничен.</b> Модель видит то, что есть в текущем разговоре: ваши сообщения, файлы, инструкции. Всё остальное она не знает.</li>
<li><b>Может звучать уверенно и ошибаться.</b> Гладкий текст не гарантирует верных фактов.</li>
<li><b>Отлично работает с языком и структурой</b>: обобщать, переписывать, рассуждать, сравнивать, писать код.</li>
</ul>
<div class="note"><b>Практический вывод</b>Чем больше нужного контекста вы дали, тем лучше ответ. Чем важнее решение, тем внимательнее проверка.</div>`},

  {id:"2.1", title:"Делегирование: что поручать ИИ", html:`
<p>Делегирование складывается из трёх частей.</p>

<h3>Хорошо подходит для ИИ</h3>

<h3>Требует вашего участия</h3>
<ul><li>Решения, где важны отношения с людьми и неформальный контекст.</li><li>Финальные цифры для собственника и официальных документов.</li><li>Всё, где ошибка дорого стоит и её трудно заметить.</li></ul>

  {id:"2.2", title:"Описание: три уровня", html:`
<p>Хорошее описание задачи отвечает на три вопроса.</p>
<div class="tbl"><table class="t">

<tr><td>Процесс</td><td>Как к этому прийти: шаги, порядок, что учитывать</td><td>«Сначала сгруппируй по складам, потом найди отклонения больше 5%, потом объясни причины»</td></tr>

  {id:"2.3", title:"Приёмы сильного брифа", html:`

 {id:"m3", title:"Различение и добросовестность", lessons:[
  {id:"3.1", title:"Различение: как оценивать результат", html:`

  {id:"3.3", title:"Цикл работы и привычки", html:`
<p>Описание и различение работают в цикле: описали → получили результат → оценили → уточнили описание → снова оценили. Каждый виток улучшает результат и ваше понимание задачи.</p>

<li>Записывать удачные брифы и превращать их в шаблоны, проекты или скиллы.</li>

  {id:"1.1", title:"Предсказание следующего токена", html:`
<p>Языковая модель читает текст и предсказывает, какой фрагмент должен идти дальше. Такой фрагмент называется <b>токеном</b>: это часть слова, целое слово или знак препинания. Ответ строится токен за токеном.</p>
<p>Звучит просто, но чтобы хорошо предсказывать продолжение огромного количества текстов, модели пришлось выучить грамматику, факты, логику, стили письма и программирование.</p>
<h3>Что из этого следует</h3>

<div class="note"><b>Про токены</b>Русский текст обычно расходует больше токенов, чем английский того же смысла. Это важно для лимитов длины и стоимости в API.</div>`},

  {id:"3.1", title:"Галлюцинации", html:`
<p>Галлюцинация — это уверенно поданная выдуманная информация: несуществующая статья закона, неверная цифра, выдуманная цитата или ссылка.</p>

  {id:"3.2", title:"Угодничество и чувствительность к формулировкам", html:`
<p><b>Угодничество</b> — склонность соглашаться с пользователем. Если написать «я считаю, что перевозчик А лучше, подтверди», модель может подобрать аргументы под ваше мнение.</p>

 {id:"m1", title:"Что такое ИИ и как он решает задачи", lessons:[
  {id:"1.1", title:"Что считать искусственным интеллектом", html:`
<p>Единого определения ИИ нет. Граница постоянно сдвигается: то, что вчера казалось «умным» (поиск маршрута, распознавание почерка), сегодня воспринимается как обычная программа.</p>
<p>Вместо поиска определения удобно смотреть на два свойства, которые обычно есть у ИИ-систем:</p>

<h3>Связанные понятия</h3>
<div class="tbl"><table class="t">

<tr><td>Робототехника</td><td>Машины в физическом мире; ИИ — лишь часть задачи</td></tr>
</table></div>
<div class="note"><b>Узкий и общий ИИ</b>Все существующие системы — узкий ИИ: они хороши в конкретных задачах. Общий ИИ, способный решать любые интеллектуальные задачи как человек, пока не создан.</div>`},
  {id:"1.2", title:"Поиск решения", html:`
<p>Многие задачи можно представить как поиск пути от начального состояния к целевому через набор допустимых действий. Например: как развезти заказы по 12 магазинам за минимальное время.</p>

<li><b>Пространство состояний</b> — все возможные ситуации.</li>
<li><b>Переходы</b> — действия, которые переводят из одного состояния в другое.</li>
<li><b>Стоимость</b> — время, расстояние, деньги.</li>
</ul>
<p>Полный перебор быстро становится невозможным: число вариантов маршрута по 12 точкам — сотни миллионов. Поэтому используют эвристики — правила, которые сокращают поиск, хотя не всегда гарантируют лучшее решение.</p>
<h3>Игры и противник</h3>
<p>В играх вроде шахмат есть соперник. Классический подход — минимакс: выбирать ход, при котором худший для вас ответ противника оставляет вам лучший результат.</p>`},
  {id:"1.3", title:"Работа с неопределённостью", html:`
<p>Реальный мир неопределёнен: опоздает ли машина, придёт ли поставка вовремя. ИИ работает с этим через <b>вероятности</b>.</p>
<p>Ключевой инструмент — <b>правило Байеса</b>: как обновлять оценку вероятности, когда появляются новые данные. Начальная оценка (априорная) плюс свидетельство дают уточнённую (апостериорную).</p>
<div class="note"><b>Пример</b>Обычно 5% рейсов перевозчика опаздывают. Сегодня в городе снегопад, а в снег опаздывает гораздо больше рейсов. Правило Байеса позволяет пересчитать вероятность опоздания конкретного рейса с учётом снегопада.</div>
<p>На этом принципе построены, например, наивные байесовские спам-фильтры: каждое слово письма немного сдвигает оценку «спам или не спам».</p>`},

<h3>Главная ловушка — переобучение</h3>
<p>Модель может «зазубрить» обучающие примеры и плохо работать на новых данных. Поэтому качество проверяют на отложенных данных, которые модель не видела при обучении.</p>`},
  {id:"2.2", title:"Классические методы", html:`

<li><b>Метод ближайших соседей.</b> Новый объект относят к классу самых похожих известных примеров.</li>
<li><b>Линейная регрессия.</b> Предсказание числа как взвешенной суммы признаков: например, время разгрузки = база + коэффициент × количество паллет.</li>
<li><b>Логистическая регрессия.</b> Похожий подход, но для вероятности класса: опоздает рейс или нет.</li>
</ul>
<p>Эти методы просты, быстры и понятны. Во многих бизнес-задачах они работают не хуже сложных моделей.</p>`},
  {id:"2.3", title:"Нейронные сети", html:`
<p>Нейронная сеть состоит из простых элементов-нейронов. Каждый нейрон берёт входы, умножает на веса, суммирует и пропускает через функцию активации. Слои нейронов соединены друг с другом.</p>
<ul>
<li><b>Обучение</b> — подбор весов так, чтобы ошибка на примерах уменьшалась.</li>
<li><b>Глубокие сети</b> имеют много слоёв и сами выделяют полезные признаки из сырых данных: изображений, звука, текста.</li>
<li><b>Свёрточные сети</b> хорошо работают с изображениями.</li>
<li><b>Генеративные модели</b> не только распознают, но и создают новые данные: текст, изображения.</li>

<div class="note"><b>Важно</b>Нейросеть не «понимает» мир как человек. Она находит статистические закономерности в данных, на которых обучена.</div>`},

<p>LLM — большие модели общего назначения, которые сначала <b>предобучают</b> на огромных данных, а затем <b>настраивают</b> под конкретные задачи на гораздо меньших наборах.</p>

 {id:"m1", title:"Знакомство с Claude Code", lessons:[
  {id:"1.1", title:"Что такое Claude Code", html:`
<p>Claude Code — агентный инструмент для программирования. Он читает весь ваш проект, редактирует файлы, запускает команды и тесты, работает с git. Вы описываете задачу обычным языком, он планирует и делает.</p>

<div class="tbl"><table class="t">

<p>Скилл — папка с файлом <code>SKILL.md</code>, где описан повторяемый процесс. Claude Code подгружает скилл, когда задача подходит под его описание, или по вызову через слэш-команду.</p>

<p>MCP (Model Context Protocol) — открытый стандарт подключения внешних инструментов. Через MCP Claude Code может читать документы в Google Drive, задачи в Jira, сообщения в Slack, базу данных или ваш собственный сервис.</p>

  {id:"1.1", title:"Скилл как инструкция для повторяемой работы", html:`
<p>Agent Skill (скилл, навык) — это папка, которая учит Claude выполнять определённый тип задач. В ней обязательно лежит файл <code>SKILL.md</code> с инструкциями. Рядом могут быть скрипты, шаблоны, справочники и примеры.</p>
<p>Представьте, что вы оформили регламент для нового сотрудника: что делать, в каком порядке, по каким правилам, с какими шаблонами. Скилл — это такой регламент для Claude. Только Claude открывает его сам, когда видит подходящую задачу.</p>
<h3>Чем скилл отличается от других способов дать контекст</h3>
<div class="tbl"><table class="t">
<tr><th>Способ</th><th>Что хранит</th><th>Когда действует</th></tr>
<tr><td>Промпт в чате</td><td>Разовый бриф</td><td>Только в этом разговоре</td></tr>
<tr><td>Проект</td><td>Инструкции и файлы по теме</td><td>Во всех чатах проекта</td></tr>
<tr><td>Скилл</td><td>Способ выполнять определённый тип задач</td><td>Везде, где задача подходит под описание скилла</td></tr>
<tr><td>MCP / коннектор</td><td>Доступ к внешним данным и действиям</td><td>Когда нужны данные из сервиса</td></tr>
</table></div>
<div class="note"><b>Коротко</b>MCP даёт Claude доступ к инструментам. Скилл учит, как этими инструментами пользоваться для конкретной работы.</div>`},
  {id:"1.2", title:"Прогрессивная загрузка", html:`
<p>Главная инженерная идея скиллов: Claude не держит весь текст всех скиллов в голове. Загрузка идёт по уровням.</p>
<div class="tbl"><table class="t">
<tr><th>Уровень</th><th>Что загружается</th><th>Когда</th></tr>
<tr><td>1. Метаданные</td><td>Только <code>name</code> и <code>description</code> из шапки SKILL.md, около сотни токенов на скилл</td><td>Всегда, при старте</td></tr>
<tr><td>2. Инструкции</td><td>Основной текст SKILL.md</td><td>Когда задача подошла под описание</td></tr>
<tr><td>3. Ресурсы</td><td>Справочники, шаблоны, скрипты</td><td>Только если инструкции на них ссылаются и они нужны</td></tr>
</table></div>
<p>Поэтому можно установить десятки скиллов без перегрузки контекста. А скрипты особенно экономны: Claude их запускает, и в контекст попадает только результат, а не код.</p>
<div class="note"><b>Следствие</b>Поле <code>description</code> — единственное, что Claude видит заранее. От него зависит, сработает ли скилл вообще.</div>`},

<h3>Хорошие кандидаты</h3>
<ul>
<li>Процесс, который вы объясняете Claude снова и снова: формат еженедельного отчёта по складам.</li>
<li>Работа по внутренним правилам компании: оформление претензии перевозчику по форме компании.</li>
<li>Задачи, где нужна точность через скрипт: расчёт загрузки машины по формуле.</li>
<li>Фирменный стиль документов и презентаций.</li>
</ul>
<h3>Плохие кандидаты</h3>
<ul>
<li>Разовая задача.</li>
<li>Знания по одной теме без процесса: справочник лучше положить в проект.</li>
<li>Доступ к живым данным: для этого нужен коннектор или MCP.</li>
</ul>`},

 {id:"m2", title:"Как написать скилл", lessons:[
  {id:"2.1", title:"Структура SKILL.md", html:`
<p>Файл начинается с шапки в формате YAML, затем идут инструкции в Markdown.</p>
<pre class="code">---
name: weekly-warehouse-report
description: Готовит еженедельный отчёт по складам DSD из выгрузки остатков и отгрузок. Используй, когда просят недельный отчёт по складам, KPI складов или сводку по 5 складам.
---

# Еженедельный отчёт по складам

## Входные данные
Выгрузка Excel: остатки и отгрузки по складам за неделю.

## Шаги
1. Посчитай кодом по каждому складу: отгрузки, точность сборки, OTIF.
2. Сравни с прошлой неделей, отметь отклонения больше 5%.
3. Оформи по шаблону templates/report.md.

## Правила
- Даты ДД.ММ.ГГГГ, суммы в сумах с пробелами.
- Не придумывай причины отклонений, помечай «нужно уточнить».</pre>
<h3>Требования к полям</h3>
<ul>
<li><code>name</code>: до 64 символов, только строчные латинские буквы, цифры и дефисы. Нельзя использовать слова «anthropic» и «claude».</li>
<li><code>description</code>: обязательно, до 1024 символов. Должно говорить и что делает скилл, и когда его применять.</li>
</ul>`},
  {id:"2.2", title:"Пишем хорошее описание и инструкции", html:`
<h3>Описание решает, сработает ли скилл</h3>
<div class="cmp">
<div class="bad"><div class="tag">Слабо</div><pre>description: Помощник по отчётам.</pre></div>
<div class="good"><div class="tag">Сильно</div><pre>description: Готовит еженедельный отчёт по складам из выгрузки остатков и отгрузок. Используй, когда просят недельный отчёт, KPI складов, сводку по складам или сравнение недель.</pre></div>
</div>
<p>Слабое описание слишком общее: Claude не поймёт, когда скилл нужен, или будет включать его не к месту.</p>
<h3>Инструкции</h3>
<ul>
<li>Пишите конкретные шаги, а не пожелания.</li>
<li>Объясняйте причины правил: так Claude лучше применяет их в нестандартных случаях.</li>
<li>Держите SKILL.md компактным. Длинные справочники выносите в отдельные файлы и ссылайтесь на них.</li>
<li>Добавляйте примеры хорошего результата.</li>
</ul>`},
  {id:"2.3", title:"Скрипты, шаблоны и проверка", html:`
<p>Рядом с SKILL.md можно положить:</p>
<pre class="code">weekly-warehouse-report/
├── SKILL.md
├── templates/report.md
├── reference/kpi-definitions.md
└── scripts/calc_kpi.py</pre>
<ul>
<li><b>Скрипты</b> — для расчётов, где нужна точность и повторяемость. Claude запускает их, а не пересчитывает каждый раз сам.</li>
<li><b>Шаблоны</b> — для единого формата результата.</li>
<li><b>Справочники</b> — определения, правила, коды. Загружаются, только когда нужны.</li>
</ul>
<h3>Как проверить скилл</h3>
<ol class="body">
<li>Задайте несколько разных запросов, где скилл должен сработать, и пару, где не должен.</li>
<li>Посмотрите, правильно ли он включился и следует ли Claude шагам.</li>
<li>Поправьте описание или инструкции и повторите.</li>
</ol>`},

 {id:"m3", title:"Использование и безопасность", lessons:[
  {id:"3.1", title:"Где работают скиллы", html:`
<div class="tbl"><table class="t">
<tr><th>Где</th><th>Как подключить</th></tr>
<tr><td>Приложение Claude</td><td>Встроенные скиллы (Excel, Word, PowerPoint, PDF) работают сами. Свои загружаются zip-архивом в настройках, на платных тарифах с включённым выполнением кода</td></tr>

<div class="note"><b>Важно</b>Скиллы не синхронизируются между этими местами автоматически. Скилл из Claude Code нужно отдельно загрузить в приложение, если он нужен и там.</div>
<p>Ещё один простой путь: попросить Claude в чате «оформи этот процесс как скилл». Он подготовит SKILL.md за вас.</p>`},
  {id:"3.2", title:"Безопасность скиллов", html:`
<p>Скилл может содержать скрипты и инструкции, которые Claude выполнит. Поэтому установка скилла похожа на установку программы.</p>
<ul>
<li>Используйте скиллы только из доверенных источников: свои или от проверенных авторов.</li>
<li>Перед установкой просмотрите все файлы: нет ли неожиданных обращений к сети или доступа к файлам, не связанных с назначением скилла.</li>
<li>Осторожно со скиллами, которые загружают данные с внешних сайтов: содержимое может меняться и содержать вредные инструкции.</li>
<li>В компании договоритесь, кто проверяет и одобряет скиллы для общего пользования.</li>
</ul>`},
  {id:"3.3", title:"Практика: ваш первый скилл", html:`
<div class="task"><b>Задание</b><br>
1. Выберите процесс, который повторяется хотя бы раз в неделю.<br>
2. Опишите его в чате Claude: входные данные, шаги, формат результата, правила.<br>
3. Попросите оформить это как скилл с хорошим description.<br>
4. Проверьте description: понятно ли из него, что делает скилл и когда его применять?<br>
5. Установите и протестируйте на трёх запросах.</div>
<h3>Чек-лист готового скилла</h3>
<ul>

<p>Чтобы ИИ-ассистент был полезен в работе, ему нужен доступ к данным и действиям: почта, CRM, склад, база данных, таск-трекер. Раньше каждую связку «конкретный ИИ ↔ конкретный сервис» делали отдельно. Пять приложений с ИИ и двадцать сервисов — это сто отдельных интеграций.</p>
<p><b>MCP (Model Context Protocol)</b> — открытый стандарт, который Anthropic выпустила в 2024 году. Он задаёт единый способ, которым ИИ-приложения подключаются к внешним системам. Сервис пишет один MCP-сервер, и им могут пользоваться все приложения, поддерживающие MCP.</p>

<p>Messages API не хранит историю разговора. Каждый запрос независим. Чтобы Claude «помнил» диалог, вы каждый раз отправляете всю историю.</p>
<pre class="code">history = []

def ask(text):
    history.append({"role": "user", "content": text})
    resp = client.messages.create(
        model="claude-sonnet-5-5", max_tokens=1024,
        system="Ты помощник логиста.", messages=history)
    answer = resp.content[0].text
    history.append({"role": "assistant", "content": answer})
    return answer

ask("Какие KPI важны для склада?")
ask("Распиши второй подробнее")   # модель видит прошлый ответ</pre>
<div class="note"><b>Следствие</b>Чем длиннее диалог, тем больше входных токенов в каждом запросе и тем дороже он обходится. В длинных диалогах старую часть истории сокращают или заменяют резюме.</div>`},
  {id:"1.2", title:"Стриминг", html:`
<p>Длинный ответ генерируется несколько секунд. Чтобы пользователь не ждал пустой экран, используют <b>стриминг</b>: ответ приходит частями по мере генерации (через Server-Sent Events).</p>
<pre class="code">with client.messages.stream(
    model="claude-sonnet-5-5", max_tokens=1024,
    messages=[{"role": "user", "content": "Напиши регламент приёмки"}],
) as stream:
    for text in stream.text_stream:
        print(text, end="", flush=True)</pre>
<p>Стриминг не ускоряет генерацию, но заметно улучшает ощущение скорости. Для очень длинных ответов он также помогает избежать обрыва соединения по таймауту.</p>`},

<p>В сообщение можно добавлять изображения и PDF-документы как отдельные блоки содержимого. Например, фото накладной с просьбой извлечь номера позиций и количества.</p>
<h3>Расширенное рассуждение</h3>
<p>Модели Claude умеют рассуждать перед ответом. В API это включается параметром и задаёт бюджет на рассуждение. Ответ тогда содержит блоки рассуждения и итоговый текст. Это повышает качество на сложных задачах ценой времени и токенов.</p>
<h3>Структурированный вывод</h3>
<p>Если программе нужен JSON, опишите схему. API поддерживает режимы, при которых ответ гарантированно соответствует заданной JSON-схеме. Это надёжнее, чем просто просить «ответь в JSON».</p>`},

<li><b>XML-теги для структуры.</b> Отделяйте данные от инструкций: <code>&lt;invoice&gt;...&lt;/invoice&gt;</code>, <code>&lt;rules&gt;...&lt;/rules&gt;</code>. Модель лучше понимает, что есть что.</li>

<li><b>Рассуждение перед ответом</b> для сложных задач.</li>
</ul>
<pre class="code">&lt;rules&gt;
Извлеки из накладной позиции. Если количество не читается, ставь null, не угадывай.
&lt;/rules&gt;
&lt;invoice&gt;
{текст накладной}
&lt;/invoice&gt;</pre>`},
  {id:"2.2", title:"Оценка (evals)", html:`

 {id:"m3", title:"Инструменты", lessons:[
  {id:"3.1", title:"Цикл использования инструментов", html:`
<p>Tool use позволяет Claude вызывать ваши функции: получить остаток, создать заявку, посчитать маршрут.</p>
<ol class="body">
<li>Вы передаёте в запросе список <code>tools</code>: имя, описание, JSON-схема параметров.</li>
<li>Claude решает вызвать инструмент и возвращает ответ со <code>stop_reason: "tool_use"</code> и блоком <code>tool_use</code> (имя, параметры, id).</li>
<li>Ваш код выполняет функцию.</li>
<li>Вы отправляете результат в новом сообщении <code>user</code> блоком <code>tool_result</code> с тем же id.</li>

    "required": ["sku", "warehouse"]

}]</pre>
<p>Хорошее описание объясняет, что делает инструмент, когда его использовать, и что значат параметры. Ограничения через <code>enum</code> уменьшают ошибки.</p>`},
  {id:"3.3", title:"Встроенные инструменты", html:`

<p>Если в каждом запросе повторяется большой одинаковый кусок (длинный системный промпт, справочник, договор), его можно закэшировать. Повторное чтение из кэша дешевле и быстрее обычной обработки.</p>

<script>
const PASS_MOD=2/3, PASS_FINAL=0.8, KEY="ailib-ru-v1";
let ST={courses:{},name:""};
try{const r=localStorage.getItem(KEY); if(r) ST=Object.assign(ST,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId=Object.fromEntries(CATALOG.map(c=>[c.id,c]));
const app=document.getElementById("app");

function cs(id){return ST.courses[id]||(ST.courses[id]={done:{},scores:{},final:null,cur:null});}
function steps(c){
 if(c._steps)return c._steps; const S=[];
 c.COURSE.forEach((m,mi)=>{m.lessons.forEach(l=>S.push({type:"lesson",id:l.id,mod:m,l,label:l.title,n:l.id}));
  S.push({type:"quiz",id:m.id+"-q",mod:m,label:"Тест модуля",n:(mi+1)+".T"});});
 S.push({type:"final",id:"final",label:"Итоговый экзамен",n:"Э"});
 S.push({type:"cert",id:"cert",label:"Сертификат",n:"★"});
 return c._steps=S;
}
function isDone(c,s){const st=cs(c.id); if(s.type==="lesson")return !!st.done[s.id]; if(s.type==="quiz")return (st.scores[s.id]||0)>=PASS_MOD; if(s.type==="final")return st.final!=null&&st.final>=PASS_FINAL; return false;}
function locked(c,s){const st=cs(c.id); if(s.type==="final")return !c.COURSE.every(m=>(st.scores[m.id+"-q"]||0)>=PASS_MOD); if(s.type==="cert")return !(st.final>=PASS_FINAL); return false;}
function pct(c){const L=steps(c).filter(s=>s.type!=="cert"); return Math.round(100*L.filter(s=>isDone(c,s)).length/L.length);}

/* ---------- home ---------- */
function home(){
 document.title="ИИ-курсы на русском";

   const p=pct(c), done=cs(c.id).final>=PASS_FINAL;

 const linkHTML=`<section class="track"><h2>Уже есть на русском</h2><p class="sub">У этих бесплатных курсов есть официальная или поддерживаемая автором русская версия. Ссылки ведут прямо на неё.</p><div class="shelf">${LINKS.map(l=>`<a class="c ext" href="${l.url}" target="_blank" rel="noopener"><div class="top"><span class="pill ru">${esc(l.ru)}</span><span class="len">${esc(l.len)}</span></div><h3>${esc(l.name)}</h3><p>${esc(l.desc)}</p><span class="go">${esc(l.prov)} · открыть ↗</span></a>`).join("")}</div></section>`;
 app.innerHTML=`<div class="home">

  <div class="how"><div><b>1. Уроки на русском</b>Короткие уроки по программе оригинального курса с примерами.</div><div><b>2. Тесты и экзамен</b>Тест после каждого модуля и итоговый экзамен от 80%.</div><div><b>3. Официальный курс</b>Ссылка на оригинал есть в каждом курсе. Там вы получите официальный сертификат.</div></div>

 ${trackHTML}
 ${linkHTML}
 <p class="foot">Уроки написаны заново на русском по открытым программам курсов и не являются официальными курсами или переводами Anthropic, Google, DeepLearning.AI, Хельсинкского университета или других компаний. Сертификаты на этой странице учебные. Официальные сертификаты выдаются только на сайтах оригинальных курсов. Прогресс хранится в вашем браузере.</p>
 </div>`;
 app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCourse(b.dataset.open));
}

/* ---------- course ---------- */
let C=null;
function openCourse(id){ if(!byId[id])return home(); C=byId[id]; const st=cs(id); if(!st.cur||!steps(C).find(s=>s.id===st.cur))st.cur=steps(C)[0].id; save();
 try{if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);}catch(e){}
 shell(); render(); window.scrollTo(0,0);}
function goHome(){C=null; try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} home(); window.scrollTo(0,0);}
function shell(){
 document.title=C.meta.TITLE;
 app.innerHTML=`<header class="top"><div class="brand"><button class="back" id="bback">← Все курсы</button><div class="eyebrow">${C.meta.EYEBROW}</div><h1>${C.meta.H1}</h1><a class="orig" href="${C.meta.OFFICIAL}" target="_blank" rel="noopener">Официальный курс «${C.meta.ORIG}» на английском ↗</a></div>
 <div class="progress" aria-label="Прогресс курса"><div class="bar"><i id="pbar"></i></div><div class="lbl"><span id="plbl"></span><span id="ppct"></span></div></div></header>
 <div class="grid"><nav class="toc" id="toc" aria-label="Содержание курса"></nav><main class="pane" id="pane" tabindex="-1"></main></div>`;
 document.getElementById("bback").onclick=goHome;
}
function renderTOC(){
 const st=cs(C.id), S=steps(C), toc=document.getElementById("toc"); toc.innerHTML="";
 const groups=[...C.COURSE.map((m,i)=>({h:`Модуль ${i+1} · ${m.title}`,steps:S.filter(s=>s.mod===m)})),{h:"Финал",steps:S.filter(s=>!s.mod)}];
 groups.forEach(g=>{
  const sec=document.createElement("section");
  const done=g.steps.filter(s=>isDone(C,s)).length, tot=g.steps.filter(s=>s.type!=="cert").length;
  sec.innerHTML=`<div class="mod-h"><span>${g.h}</span>${tot?`<span>${done}/${tot}</span>`:""}</div>`;
  const ol=document.createElement("ol");
  g.steps.forEach(s=>{const li=document.createElement("li"), b=document.createElement("button"), lk=locked(C,s);
   b.className=lk?"locked":""; b.setAttribute("aria-current",st.cur===s.id?"true":"false");
   b.innerHTML=`<span class="n">${s.n}</span><span>${s.label}</span><span class="st">${isDone(C,s)?"✓":lk?"🔒":""}</span>`;
   b.onclick=()=>go(s.id); li.appendChild(b); ol.appendChild(li);});
  sec.appendChild(ol); toc.appendChild(sec);});
 const L=S.filter(s=>s.type!=="cert"), d=L.filter(s=>isDone(C,s)).length;
 document.getElementById("pbar").style.width=(100*d/L.length)+"%";
 document.getElementById("plbl").textContent=`${d} из ${L.length} шагов`;
 document.getElementById("ppct").textContent=Math.round(100*d/L.length)+"%";
}
function go(id){cs(C.id).cur=id; save(); render(); const p=document.getElementById("pane"); p.focus({preventScroll:true}); if(window.innerWidth<860)p.scrollIntoView({behavior:"smooth"}); else window.scrollTo({top:0,behavior:"smooth"});}
function navRow(idx,canNext){const S=steps(C), prev=S[idx-1], next=S[idx+1];
 return `<div class="nav-row"><button class="btn" id="bprev" ${prev?"":"disabled"}>← ${prev?prev.label:"Назад"}</button>${next?`<button class="btn primary" id="bnext" ${canNext?"":"disabled"}>${next.label} →</button>`:`<button class="btn primary" id="bhome">К библиотеке →</button>`}</div>`;}
function bindNav(idx){const S=steps(C), p=document.getElementById("bprev"), n=document.getElementById("bnext"), h=document.getElementById("bhome");
 if(p&&S[idx-1])p.onclick=()=>go(S[idx-1].id); if(n)n.onclick=()=>go(S[idx+1].id); if(h)h.onclick=goHome;}
function shuf(x){for(let i=x.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[x[i],x[k]]=[x[k],x[i]];}return x;}
function quizHTML(qs,prefix){
 return `<form class="quiz" id="qf">${qs.map((q,i)=>`<fieldset class="q" id="${prefix}${i}"><legend class="qt">${i+1}. ${q.q}</legend>${shuf(q.a.map((a,j)=>[a,j])).map(([a,j])=>`<label><input type="radio" name="${prefix}${i}" id="${prefix}${i}_${j}" value="${j}"> <span>${a}</span></label>`).join("")}<div class="ex" hidden></div></fieldset>`).join("")}
 <div><button class="btn primary" type="submit">Проверить ответы</button></div><div id="qres"></div></form>`;}
function gradeQuiz(qs,prefix,showEx){let ok=0;
 qs.forEach((q,i)=>{const fs=document.getElementById(prefix+i), v=fs.querySelector("input:checked"), r=v&&+v.value===q.c; if(r)ok++;
  fs.classList.remove("right","wrong"); fs.classList.add(r?"right":"wrong");
  const ex=fs.querySelector(".ex"); if(showEx){ex.hidden=false; ex.textContent=(r?"Верно. ":"Правильный ответ: «"+q.a[q.c]+"». ")+(q.ex||"");}});
 return ok/qs.length;}
function render(){
 renderTOC();
 const st=cs(C.id), S=steps(C), idx=Math.max(0,S.findIndex(s=>s.id===st.cur)), s=S[idx], pane=document.getElementById("pane"), FINAL=C.FINAL;
 if(locked(C,s)){pane.innerHTML=`<div class="lesson-meta">${s.label}</div><h2>Пока закрыто</h2><p>${s.type==="final"?"Сначала сдайте тесты всех модулей: минимум 2 правильных ответа из 3 в каждом.":"Сертификат откроется после итогового экзамена с результатом от 80%."}</p>`+navRow(idx,false); bindNav(idx); return;}
 if(s.type==="lesson"){const mi=C.COURSE.indexOf(s.mod)+1;
  pane.innerHTML=`<div class="lesson-meta">Модуль ${mi} · Урок ${s.id}</div><h2>${s.l.title}</h2>${s.l.html}`+navRow(idx,true);
  bindNav(idx); st.done[s.id]=true; save(); renderTOC();
 } else if(s.type==="quiz"){const mi=C.COURSE.indexOf(s.mod)+1;
  pane.innerHTML=`<div class="lesson-meta">Модуль ${mi} · Тест</div><h2>Проверка: ${s.mod.title}</h2><p>Три вопроса, у каждого четыре варианта. Чтобы засчитать модуль, нужно ответить верно минимум на два.</p>`+quizHTML(s.mod.quiz,"q")+navRow(idx,isDone(C,s));
  bindNav(idx);
  document.getElementById("qf").onsubmit=e=>{e.preventDefault(); const sc=gradeQuiz(s.mod.quiz,"q",true); st.scores[s.id]=Math.max(st.scores[s.id]||0,sc); save();
   const pass=sc>=PASS_MOD; document.getElementById("qres").innerHTML=`<div class="result ${pass?"pass":"fail"}">${Math.round(sc*3)} из 3 · ${pass?"Модуль засчитан":"Перечитайте уроки модуля и попробуйте снова"}</div>`;
   const n=document.getElementById("bnext"); if(n)n.disabled=!isDone(C,s); renderTOC();};
 } else if(s.type==="final"){const need=Math.ceil(FINAL.length*PASS_FINAL);
  pane.innerHTML=`<div class="lesson-meta">Итоговый экзамен</div><h2>${FINAL.length} вопросов по всему курсу</h2><p>Проходной балл 80%, то есть ${need} правильных ответов. Пояснений к ошибкам здесь нет, только отметка верно или неверно. Порядок вариантов меняется при каждом открытии. Пересдавать можно сколько угодно.</p>`+quizHTML(FINAL,"f")+navRow(idx,isDone(C,s));
  bindNav(idx);
  document.getElementById("qf").onsubmit=e=>{e.preventDefault(); const sc=gradeQuiz(FINAL,"f",false); st.final=Math.max(st.final||0,sc);
   if(sc>=PASS_FINAL&&!st.certId){st.certId=C.meta.PREFIX+"-"+Date.now().toString(36).toUpperCase().slice(-6); st.certDate=new Date().toISOString();} save();
   const pass=sc>=PASS_FINAL; document.getElementById("qres").innerHTML=`<div class="result ${pass?"pass":"fail"}">${Math.round(sc*FINAL.length)} из ${FINAL.length} · ${pass?"Экзамен сдан. Сертификат открыт":"Нужно "+need+" из "+FINAL.length+". Попробуйте ещё раз"}</div>`;
   const n=document.getElementById("bnext"); if(n)n.disabled=!isDone(C,s); renderTOC();};
 } else {
  const d=st.certDate?new Date(st.certDate):new Date(), ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  const nl=C.COURSE.reduce((n,m)=>n+m.lessons.length,0);
  pane.innerHTML=`<div class="lesson-meta">Финал</div><h2>Ваш сертификат</h2>
  <p>Впишите имя так, как оно должно стоять в сертификате. Сохранить его можно скриншотом.</p>
  <div class="cert-form"><input id="nm" placeholder="Имя и фамилия" value="${esc(ST.name||"")}" maxlength="60" aria-label="Имя для сертификата"></div>
  <div class="cert"><div class="cert-in">
   <svg class="seal" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="var(--seal)" stroke-width="2"><circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="46" stroke-dasharray="3 4"/></g><circle cx="60" cy="60" r="38" fill="var(--seal)"/><text x="60" y="56" text-anchor="middle" font-family="Unbounded,Arial Black,sans-serif" font-size="${C.meta.SEAL.length>3?16:20}" font-weight="700" fill="var(--paper)">${C.meta.SEAL}</text><text x="60" y="76" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="2" fill="var(--paper)">ПРОЙДЕН</text></svg>
   <div class="k">Сертификат о прохождении подготовительного курса</div>
   <div class="ttl">${C.meta.CERTTTL}</div>
   <div class="k" style="margin-top:14px">Настоящим подтверждается, что</div>
   <div class="who" id="who">${esc(ST.name||"Имя Фамилия")}</div>
   <p style="margin:0;max-width:56ch">освоил(а) курс из ${C.COURSE.length} модулей и ${nl} уроков: ${C.meta.TOPICS}, и сдал(а) итоговый экзамен.</p>
   <div class="row"><div><span class="k">Дата</span><span>${ds}</span></div><div><span class="k">Результат</span><span>${Math.round((st.final||0)*100)}%</span></div><div><span class="k">Номер</span><span>${st.certId||"—"}</span></div></div>
  </div></div>
  <p class="disc">Учебный сертификат подготовительного курса. Уроки написаны на русском по программе курса «${C.meta.ORIG}» (${C.meta.PROVIDER}) и не являются официальным курсом ${C.meta.PROVIDER} или его переводом. Официальный сертификат выдаётся только на <a href="${C.meta.OFFICIAL}" target="_blank" rel="noopener">сайте оригинального курса</a>.</p>`+navRow(idx,false);
  bindNav(idx);
  const nm=document.getElementById("nm"); nm.oninput=()=>{ST.name=nm.value.trim(); document.getElementById("who").textContent=ST.name||"Имя Фамилия"; save();};
 }
}
function route(){const h=(location.hash||"").slice(1); if(h&&byId[h])openCourse(h); else home();}
window.addEventListener("hashchange",route);
route();
</script>
